<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Affiliate Product Store</title>
    <link rel="stylesheet" href="css/styles.css">
    </head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">🛍️ Affiliate Store</div>
            <div class="nav-buttons">
                <button class="btn-secondary view-toggle" data-view="store">Store</button>
                <!-- Admin Panel button intentionally removed from public nav -->
            </div>
        </div>
    </header>

    <div class="container">
        <!-- Affiliate Disclosure -->
        <div class="affiliate-disclosure">
            ⚡ <strong>Disclosure:</strong> As an Amazon Associate, I earn from qualifying purchases. Links help support this site at no extra cost to you.
        </div>

        <!-- Store View -->
        <div class="store-view active">
            <h1 style="margin-bottom: 20px;">Featured Products</h1>
            
            <div class="search-filter">
                <input type="text" id="searchInput" placeholder="Search products...">
            </div>

            <div class="products-grid" id="productsGrid">
                <!-- Products will be populated here -->
            </div>

            <div id="emptyState" class="empty-state" style="display: none;">
                <h3>No products found</h3>
            </div>

            <script src="js/store.js" defer></script>
        // Initialize app
        app.init();
    </script>
</body>
</html>
