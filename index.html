<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Best Products & Deals</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Top product recommendations and deals">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f6f6f6;
            margin: 0;
            padding: 0;
        }
        header {
            background: #232f3e;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 1000px;
            margin: auto;
            padding: 20px;
        }
        .product {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .product img {
            width: 180px;
            border-radius: 8px;
        }
        .product h2 {
            margin: 0 0 10px;
        }
        .product a {
            background: #ff9900;
            color: black;
            padding: 10px 15px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
        }
        footer {
            text-align: center;
            font-size: 14px;
            padding: 15px;
            background: #eee;
        }
    </style>
</head>
<body>

<header>
    <h1>Best Product Recommendations</h1>
    <p>Honest reviews & best deals</p>
</header>

<div class="container" id="products"></div>

<script>
fetch("products.json")
  .then(res => res.json())
  .then(products => {
    const container = document.getElementById("products");

    products.forEach(p => {
      container.innerHTML += `
        <div class="product">
          <img src="${p.image}" alt="${p.name}">
          <div>
            <h2>${p.name}</h2>
            <p>${p.description}</p>
            <a href="${p.link}" target="_blank" rel="nofollow sponsored noopener">
              View on Amazon
            </a>
          </div>
        </div>
      `;
    });
  });
</script>

<footer>
    <p>As an Amazon Associate, I earn from qualifying purchases.</p>
</footer>

</body>
</html>
