<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Admin — Secret</title>
    <style>
        /* Minimal copy of the site's admin styles for the admin page */
        body{font-family:Segoe UI, Tahoma, Geneva, Verdana, sans-serif;background:#f5f5f5;color:#333;padding:20px}
        .admin-form{background:#fff;padding:20px;border-radius:8px;max-width:720px;margin:0 auto 20px;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
        .form-group{margin-bottom:12px}
        label{display:block;margin-bottom:6px;font-weight:600}
        input,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px}
        button{padding:10px 16px;border:none;border-radius:6px;cursor:pointer}
        .btn-primary{background:#ff9900;color:#fff}
        .btn-secondary{background:#ddd}
        .admin-products{max-width:900px;margin:20px auto}
        .admin-product-item{background:#fff;padding:12px;border-radius:6px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
        .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);align-items:center;justify-content:center}
        .modal.active{display:flex}
        .modal-content{background:#fff;padding:20px;border-radius:8px;max-width:600px;width:90%}
    </style>
</head>
<body>
<h1 style="text-align:center;margin-bottom:20px">🔐 Admin (Secret URL)</h1>

<div class="admin-form">
    <h2>Add New Product</h2>
    <div class="form-group">
        <label>Product Name *</label>
        <input id="productName" placeholder="Product Name">
    </div>
    <div class="form-group">
        <label>ASIN *</label>
        <input id="productASIN" placeholder="ASIN">
    </div>
    <div class="form-group">
        <label>Price *</label>
        <input id="productPrice" placeholder="$19.99">
    </div>
    <div class="form-group">
        <label>Images (comma-separated URLs or emoji)</label>
        <input id="productImages" placeholder="https://... , https://...">
    </div>
    <div class="form-group">
        <label>Description</label>
        <textarea id="productDescription"></textarea>
    </div>
    <div class="form-group">
        <label>Category</label>
        <input id="productCategory">
    </div>
    <div style="display:flex;gap:8px">
        <button class="btn-primary" id="addBtn">Add Product</button>
        <button class="btn-secondary" id="exportBtn">Export JSON (download)</button>
    </div>
</div>

<section class="admin-products">
    <h2>Manage Products</h2>
    <div id="productList"></div>
</section>

<!-- Edit modal -->
<div id="editModal" class="modal"><div class="modal-content">
    <h3>Edit Product</h3>
    <div class="form-group"><label>Name</label><input id="editName"></div>
    <div class="form-group"><label>ASIN</label><input id="editASIN"></div>
    <div class="form-group"><label>Price</label><input id="editPrice"></div>
    <div class="form-group"><label>Images (comma-separated)</label><input id="editImages"></div>
    <div class="form-group"><label>Description</label><textarea id="editDesc"></textarea></div>
    <div style="display:flex;gap:8px"><button id="saveEdit" class="btn-primary">Save</button><button id="cancelEdit" class="btn-secondary">Cancel</button></div>
</div></div>

<link rel="stylesheet" href="css/admin.css">
<script src="js/admin.js" defer></script>
</body>
</html>
