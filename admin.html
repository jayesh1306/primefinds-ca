<!DOCTYPE html>
<html>
<head>
  <title>Admin – Add Product</title>
</head>
<body>

<script>
const password = prompt("Enter admin password:");
if (password !== "CHANGE_THIS_PASSWORD") {
  document.body.innerHTML = "Access denied";
}
</script>

<h2>Add Product (Admin Only)</h2>

<form id="productForm">
  <input placeholder="Product name" required><br><br>
  <input placeholder="Description" required><br><br>
  <input placeholder="Image URL" required><br><br>
  <input placeholder="Amazon link" required><br><br>
  <button type="submit">Generate JSON</button>
</form>

<pre id="output"></pre>

<script>
document.getElementById("productForm").onsubmit = e => {
  e.preventDefault();
  const inputs = e.target.querySelectorAll("input");

  const product = {
    name: inputs[0].value,
    description: inputs[1].value,
    image: inputs[2].value,
    link: inputs[3].value
  };

  document.getElementById("output").textContent =
    JSON.stringify(product, null, 2);
};
</script>

</body>
</html>
